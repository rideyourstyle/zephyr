# nucleo_c092rc — OpenOCD configuration
#
# Requires the STMicroelectronics OpenOCD fork (adds target/stm32c0x.cfg):
# https://github.com/STMicroelectronics/OpenOCD
#
# Build with:
#   west build ... -- -DOPENOCD=/usr/local/bin/openocd \
#                     -DOPENOCD_DEFAULT_PATH=/usr/local/share/openocd/scripts

# If ADAPTER_SERIAL is pre-set via -c before this file, select the adapter.
# Usage:  openocd -c 'set ADAPTER_SERIAL 0670FF...' -f openocd.cfg
if { [info exists ADAPTER_SERIAL] } {
    adapter serial $ADAPTER_SERIAL
}

source [find interface/stlink.cfg]
transport select swd
source [find target/stm32c0x.cfg]

# stm32c0x.cfg sets srst_nogate; keep it.
# Override the examine-end handler: defer DBGMCU setup until after halt
# to avoid memory access before the CPU is ready (causes SIGSEGV via hla_swd).
$_TARGETNAME configure -event examine-end {}

$_TARGETNAME configure -event halted {
    # Enable DBGMCU clock: RCC_APBENR1 |= DBGMCUEN
    mmw 0x4002103C 0x08000000 0
    # Enable debug during low power modes: DBGMCU_CR |= DBG_STANDBY | DBG_STOP
    mmw 0x40015804 0x00000006 0
    # Stop watchdog counters during halt: DBGMCU_APB1_FZ |= DBG_WDGLS_STOP | DBG_WWDG_STOP
    mmw 0x40015808 0x00001800 0
}

$_TARGETNAME configure -event gdb-attach {
        echo "Debugger attaching: halting execution"
        reset halt
        gdb_breakpoint_override hard
}

$_TARGETNAME configure -event gdb-detach {
        echo "Debugger detaching: resuming execution"
        resume
}
